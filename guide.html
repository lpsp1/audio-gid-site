<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Аудио гид — карта и истории Калининградской области</title>
  <meta name="description" content="41 место Калининградской области с озвученными историями: Черняховск, Калининград, побережье и Куршская коса.">
  <meta name="theme-color" content="#0e3a46">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <script type="module" crossorigin src="./assets/guide-Dpedk6mO.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/timemachine-Dl1xCkax.js">
  <link rel="stylesheet" crossorigin href="./assets/timemachine-BPMNkGm7.css">
  <link rel="stylesheet" crossorigin href="./assets/guide-DY_hVSuY.css">
</head>
<body class="guide">
  <header class="bar">
    <a class="mark" href="./" data-i18n-attr="aria-label:toHome">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M16 2c6 0 11 4.6 11 10.6C27 20 16 30 16 30S5 20 5 12.6C5 6.600 10 2 16 2z" fill="currentColor"/><path d="M12 9v8M16 7v12M20 10v6" stroke="#f2f6f5" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span>Аудио гид</span>
    </a>
    <div class="bar__right">
      <button class="chip" id="nearBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2l7 19-7-4-7 4z" fill="currentColor"/></svg>
        <span data-i18n="near">Рядом со мной</span>
      </button>
      <button class="chip chip--points" id="pointsBtn" type="button">
        <b id="pointsValue">0</b> <span data-i18n="pointsWord">баллов</span>
      </button>
      <div class="lang" role="group" data-i18n-attr="aria-label:language">
        <button type="button" data-lang-btn="ru">RU</button>
        <button type="button" data-lang-btn="en">EN</button>
      </div>
    </div>
  </header>

  <main class="app">
    <section class="map" id="map" data-i18n-attr="aria-label:mapLabel"></section>

    <aside class="panel" id="panel">
      <div class="view view--list" id="listView">
        <h1 class="panel__title" data-i18n="listTitle">41 место Калининградской области</h1>
        <p class="panel__sub" id="progressLine"></p>
        <div class="tabsbar" role="tablist">
          <button type="button" role="tab" data-tab="places" aria-selected="true" data-i18n="tabPlaces">Места</button>
          <button type="button" role="tab" data-tab="routes" aria-selected="false" data-i18n="tabRoutes">Маршруты</button>
        </div>

        <div id="tabPlaces">
          <label class="search">
            <span class="visually-hidden" data-i18n="search">Поиск</span>
            <input type="search" id="search" autocomplete="off" data-i18n-attr="placeholder:searchPh">
          </label>
          <div class="filters" id="filters" role="group" data-i18n-attr="aria-label:filterLabel"></div>
          <ol class="places" id="places"></ol>
          <p class="empty" id="empty" hidden data-i18n="empty">Ничего не нашлось. Попробуйте другое слово.</p>
        </div>

        <div id="tabRoutes" hidden>
          <section class="myroute" id="myRoute"></section>
          <h2 class="panel__h2" data-i18n="readyRoutes">Готовые маршруты</h2>
          <ol class="routes" id="routeList"></ol>
        </div>
      </div>

      <article class="view view--detail" id="detailView" hidden></article>
      <article class="view view--detail" id="routeView" hidden></article>
    </aside>
  </main>

  <footer class="player" id="player" hidden>
    <button class="player__play" id="playBtn" type="button" data-i18n-attr="aria-label:playPause">
      <svg class="i-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M7 4l14 8-14 8z" fill="currentColor"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>
    </button>
    <button class="player__title" id="playerTitle" type="button"></button>
    <button class="player__skip" id="backBtn" type="button" data-i18n-attr="aria-label:back15">−15</button>
    <button class="player__skip" id="nextBtn" type="button" hidden data-i18n-attr="aria-label:nextStop">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 4l10 8-10 8zM17 4h3v16h-3z" fill="currentColor"/></svg>
    </button>
    <input class="player__seek" id="seek" type="range" min="0" max="1000" value="0" data-i18n-attr="aria-label:seek">
    <span class="player__time" id="time">0:00</span>
    <button class="player__skip" id="speedBtn" type="button" data-i18n-attr="aria-label:speed">1×</button>
  </footer>

  <dialog class="sheet" id="rewards">
    <form method="dialog"><button class="sheet__close" data-i18n-attr="aria-label:close">×</button></form>
    <div id="rewardsBody"></div>
  </dialog>

  <dialog class="sheet sheet--wide" id="tm">
    <form method="dialog"><button class="sheet__close" data-i18n-attr="aria-label:close">×</button></form>
    <div id="tmBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <audio id="audio" preload="none"></audio>

  <noscript><p style="padding:24px">Для работы гида нужен JavaScript. For the guide to work, please enable JavaScript.</p></noscript>
</body>
</html>
